services:
  mcp-owui:
    # openwebui-mcp has no semver release yet; pinned to its latest built commit.
    # Check for a newer sha-<commit> tag at https://github.com/vedmaka/openwebui-mcp/pkgs/container/openwebui-mcp
    image: ghcr.io/vedmaka/openwebui-mcp:sha-5ea11df7698748250fb50b31e1fcd06a583f69be
    command: [ "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "${MCP_PORT:-8001}" ]
    env_file:
      - .env
    ports:
      - "${MCP_PORT:-8001}:${MCP_PORT:-8001}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      openwebui:
        condition: service_healthy
